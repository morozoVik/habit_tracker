name: Deploy Habit Tracker

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-django flake8

    - name: Lint
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test
      env:
        SECRET_KEY: test-key-123
        DEBUG: True
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        TELEGRAM_BOT_TOKEN: dummy
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        python manage.py migrate
        pytest -v --ds=config.settings

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v3

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        # Копируем файлы на сервер
        scp -r docker-compose.prod.yml .github .env.example Dockerfile requirements.txt ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR }}/
        
        # Копируем папки с кодом
        scp -r config habits users manage.py ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR }}/
        
        # Выполняем деплой
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} "
          set -e
          cd ${{ secrets.DEPLOY_DIR }}
          
          echo '=== Проверка Docker ==='
          docker --version
          docker compose version
          
          echo '=== Создание .env файла если нет ==='
          if [ ! -f .env ]; then
            echo 'Создаем .env файл из примера...'
            cp .env.example .env
            echo 'Пожалуйста, отредактируйте файл .env на сервере!'
          fi
          
          echo '=== Остановка старых контейнеров ==='
          docker compose -f docker-compose.prod.yml down || true
          
          echo '=== Сборка и запуск новых контейнеров ==='
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          
          echo '=== Ожидание запуска контейнеров ==='
          sleep 15
          
          echo '=== Выполнение миграций ==='
          docker compose -f docker-compose.prod.yml exec django python manage.py migrate --noinput
          
          echo '=== Сборка статики ==='
          docker compose -f docker-compose.prod.yml exec django python manage.py collectstatic --noinput
          
          echo '=== Создание суперпользователя (если нет) ==='
          docker compose -f docker-compose.prod.yml exec django python manage.py shell -c \"
            from django.contrib.auth import get_user_model
            User = get_user_model()
            if not User.objects.filter(username='admin').exists():
                User.objects.create_superuser('admin', 'admin@example.com', 'admin123')
                print('Superuser created')
            else:
                print('Superuser already exists')
          \"
          
          echo '=== Проверка статуса контейнеров ==='
          docker compose -f docker-compose.prod.yml ps
          
          echo '=== Деплой успешно завершен! ==='
        "